name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
  UV_VERSION: 0.11.29

jobs:
  secret-scan:
    name: Secret and workflow scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full publishable history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source and history with Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --no-banner .
      - name: Validate workflow syntax and semantics
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

  source-scan:
    name: Filesystem policy scan
    runs-on: ubuntu-24.04
    needs: secret-scan
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce public-source boundary
        run: python scripts/check_source_safety.py
      - name: Scan source configuration and secrets with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    needs: [secret-scan, source-scan]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.13', '3.13.11']
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install exact locked environment
        run: uv sync --frozen --group dev
      - name: Verify exported runtime lock is current
        if: matrix.python == '3.12.13'
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Compile package sources
        run: uv run python -m compileall -q src scripts tests
      - name: Run offline conformance suite
        run: uv run pytest -q -p no:cacheprovider
      - name: Catch lint and formatting failures
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run static type analysis
        run: uv run mypy
      - name: Reject high-severity source findings
        if: matrix.python == '3.12.13'
        run: uv run bandit -q -r src/madpanda_ffmpeg_mcp -lll
      - name: Audit locked runtime dependencies
        if: matrix.python == '3.12.13'
        run: uv run pip-audit --requirement requirements.lock

  package:
    name: Python package
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel and source archive
        run: |
          uv sync --frozen --group dev
          uv build
          uv run twine check dist/*
      - name: Install and inspect exact wheel
        env:
          MCP_MODE: standalone
          MCP_ACCESS_TOKEN: wheel-access-token-000000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: wheel-download-secret-00000000000000000000000000000000000000000
          PUBLIC_BASE_URL: http://127.0.0.1:8087
        run: |
          python -m venv /tmp/ffmpeg-wheel-venv
          /tmp/ffmpeg-wheel-venv/bin/python -m pip install \
            --disable-pip-version-check --require-hashes \
            --requirement requirements.lock
          /tmp/ffmpeg-wheel-venv/bin/python -m pip install \
            --disable-pip-version-check --no-deps dist/*.whl
          /tmp/ffmpeg-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points, version

          from madpanda_ffmpeg_mcp import __version__
          from madpanda_ffmpeg_mcp.server import TOOL_REGISTRY, _current_tool_manifest

          assert version('mad-mcp-ffmpeg') == '1.0.0'
          assert __version__ == '1.0.0'
          manifest = _current_tool_manifest()
          assert len(TOOL_REGISTRY) == 55
          assert manifest['catalogVersion'] == '2026-07-18.4'
          assert manifest['counts'] == {
              'raw': 55,
              'agentReady': 55,
              'legacy': 0,
              'hidden': 0,
          }
          scripts = {item.name: item.value for item in entry_points(group='console_scripts')}
          assert scripts['mad-mcp-ffmpeg'] == 'madpanda_ffmpeg_mcp.server:main'
          assert scripts['mad-mcp-ffmpeg-worker'] == 'madpanda_ffmpeg_mcp.worker:main'
          PY

  image:
    name: Hardened image
    runs-on: ubuntu-24.04
    needs: [test, package]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate every supported Compose variant
        env:
          MCP_ACCESS_TOKEN: ci-standalone-token-000000000000000000000000000000000000000000
          MCP_PORTAL_GRANT_TOKEN: ci-portal-grant-000000000000000000000000000000000000000000
          MCP_PRINCIPAL_HASH_SECRET: ci-principal-secret-000000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: ci-download-secret-000000000000000000000000000000000000000000
          REDIS_PASSWORD: ci-redis-password-000000000000000000000000000000000000000000
          MCP_PORTAL_NETWORK: ci-portal-network
          PUBLIC_BASE_URL: https://ffmpeg-mcp.example.invalid
          MCP_BUILD_SHA: 0000000000000000000000000000000000000001
          MCP_SOURCE_FINGERPRINT: 1111111111111111111111111111111111111111111111111111111111111111
          MCP_IMAGE_REFERENCE: development
          MCP_RELEASE_DIGEST: 2222222222222222222222222222222222222222222222222222222222222222
        run: |
          for manifest in \
            docker-compose.yml \
            docker-compose.portal.yml \
            docker-compose.release.yml \
            docker-compose.portal.release.yml; do
            docker compose -f "$manifest" config --quiet
            docker compose -f "$manifest" config --format json > "/tmp/${manifest}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          expected_release = 'ghcr.io/madpanda3d/ffmpeg-mcp-server@sha256:' + ('2' * 64)
          variants = {
              'docker-compose.yml': ('standalone', True),
              'docker-compose.portal.yml': ('portal', True),
              'docker-compose.release.yml': ('standalone', False),
              'docker-compose.portal.release.yml': ('portal', False),
          }
          for manifest, (mode, source_build) in variants.items():
              config = json.loads(Path(f'/tmp/{manifest}.json').read_text())
              assert config['name'] == 'ffmpeg-mcp', manifest
              services = config['services']
              assert set(services) == {'ffmpeg-mcp', 'worker', 'redis'}, manifest
              for name in ('ffmpeg-mcp', 'worker'):
                  service = services[name]
                  assert ('build' in service) is source_build, (manifest, name)
                  assert service['read_only'] is True, (manifest, name)
                  assert service['user'] == '10001:10001', (manifest, name)
                  assert service['cap_drop'] == ['ALL'], (manifest, name)
                  assert service['security_opt'] == ['no-new-privileges:true'], (manifest, name)
                  expected_image = 'ffmpeg-mcp:local-source' if source_build else expected_release
                  assert service['image'] == expected_image, (manifest, name)
              server = services['ffmpeg-mcp']
              worker = services['worker']
              assert server['environment']['MCP_MODE'] == mode, manifest
              assert server['environment']['MCP_EXPECTED_TOOL_COUNT'] == '55', manifest
              assert server['environment']['MCP_PRINCIPAL_HASH_SECRET'], manifest
              assert server['environment']['REDIS_URL'].startswith('redis://:'), manifest
              forbidden_worker_keys = {
                  'MCP_ACCESS_TOKEN',
                  'MCP_PORTAL_GRANT_TOKEN',
                  'MCP_PRINCIPAL_HASH_SECRET',
                  'DOWNLOAD_SIGNING_SECRET',
                  'GOOGLE_DRIVE_CREDENTIALS_PATH',
                  'GOOGLE_DRIVE_IMPERSONATE_USER',
                  'DISCORD_BOT_TOKEN',
              }
              assert forbidden_worker_keys.isdisjoint(worker['environment']), manifest
              assert not any(
                  key.startswith(('GOOGLE_DRIVE_', 'DISCORD_'))
                  for key in worker['environment']
              ), manifest
              assert worker['environment']['REDIS_URL'].startswith('redis://:'), manifest
              for key in (
                  'MAX_INGEST_BYTES',
                  'MAX_OUTPUT_BYTES',
                  'MAX_CONCAT_CLIPS',
                  'MAX_SLIDESHOW_IMAGES',
                  'MAX_AUDIO_TRACKS',
                  'MAX_TEMPLATE_LAYERS',
                  'MAX_TEMPLATE_TEXT_LAYERS',
                  'MAX_WORKFLOW_NODES',
                  'MAX_BATCH_ASSETS',
                  'MAX_BATCH_PRESETS',
                  'MAX_BATCH_OPERATIONS',
                  'MAX_RENDER_ITERATIONS',
                  'MAX_CAPTION_WORD_TIMINGS',
                  'MAX_FRAME_WIDTH',
                  'MAX_FRAME_HEIGHT',
                  'MAX_FRAME_PIXELS',
                  'MAX_MEDIA_STREAMS',
                  'MAX_VIDEO_FPS',
                  'MAX_AUDIO_CHANNELS',
                  'MAX_AUDIO_SAMPLE_RATE',
                  'MAX_DECODED_VIDEO_PIXEL_FRAMES',
                  'MAX_DECODED_AUDIO_SAMPLE_CHANNELS',
                  'FFMPEG_RLIMIT_AS_BYTES',
                  'FFPROBE_RLIMIT_AS_BYTES',
                  'FFMPEG_RLIMIT_CPU_SECONDS',
                  'FFPROBE_RLIMIT_CPU_SECONDS',
                  'MEDIA_RLIMIT_NOFILE',
                  'FFMPEG_THREADS',
                  'REDIS_MAXMEMORY_BYTES',
                  'JOB_ADMISSION_OWNER_MAX_ACTIVE',
                  'JOB_ADMISSION_GLOBAL_MAX_ACTIVE',
                  'JOB_ADMISSION_OWNER_RPM',
                  'JOB_ADMISSION_EXECUTION_BUFFER_SECONDS',
                  'METRICS_TTL_SECONDS',
                  'BRAND_KIT_MAX_COUNT',
                  'BRAND_KIT_MAX_SERIALIZED_BYTES',
                  'BRAND_KIT_MAX_STRING_CHARS',
                  'S3_CONNECT_TIMEOUT_SECONDS',
                  'S3_READ_TIMEOUT_SECONDS',
                  'STORAGE_ASGI_MAX_CONCURRENCY',
                  'STORAGE_ASGI_ADMISSION_TIMEOUT_SECONDS',
                  'STORAGE_ASGI_OPERATION_TIMEOUT_SECONDS',
                  'STORAGE_STAGING_MAX_AGE_SECONDS',
                  'INGEST_STAGING_OWNER_MAX_ACTIVE',
                  'INGEST_STAGING_GLOBAL_MAX_ACTIVE',
                  'INGEST_STAGING_OWNER_MAX_BYTES',
                  'INGEST_STAGING_GLOBAL_MAX_BYTES',
                  'INGEST_STAGING_LEASE_SECONDS',
                  'INGEST_STAGING_HEARTBEAT_SECONDS',
                  'ASSET_QUOTA_OWNER_MAX_COUNT',
                  'ASSET_QUOTA_OWNER_MAX_BYTES',
                  'ASSET_QUOTA_GLOBAL_MAX_COUNT',
                  'ASSET_QUOTA_GLOBAL_MAX_BYTES',
                  'ASSET_RESERVATION_LEASE_SECONDS',
                  'ASSET_RESERVATION_HEARTBEAT_SECONDS',
                  'ASSET_DELETE_LEASE_SECONDS',
                  'ASSET_DELETE_RETRY_BASE_SECONDS',
                  'ASSET_DELETE_RETRY_MAX_SECONDS',
                  'JOB_STORAGE_MAX_OUTPUT_COUNT',
                  'JOB_STORAGE_MAX_OUTPUT_BYTES',
                  'JOB_STORAGE_MAX_MATERIALIZE_BYTES',
                  'MCP_LOG_LEVEL',
                  'MCP_LOG_STRUCTURED',
              ):
                  assert key in server['environment'], (manifest, key)
                  assert key in worker['environment'], (manifest, key)
              for key in (
                  'ALLOWED_CONTENT_TYPES',
                  'ALLOW_IMAGE_INGEST',
                  'CLEANUP_INTERVAL_SECONDS',
                  'JOB_STALE_SECONDS',
                  'MCP_LOG_REQUESTS',
              ):
                  assert key in server['environment'], (manifest, key)
                  assert key not in worker['environment'], (manifest, key)
              assert set(worker['networks']) == {'backend', 'egress'}, manifest
              assert set(services['redis']['networks']) == {'backend'}, manifest
              assert services['redis']['user'] == '999:1000', manifest
              redis_command = ' '.join(services['redis']['command'])
              assert 'requirepass' in redis_command, manifest
              assert '--maxmemory' in redis_command, manifest
              assert '--maxmemory-policy noeviction' in redis_command, manifest
              redis_maxmemory = int(services['redis']['environment']['REDIS_MAXMEMORY_BYTES'])
              assert redis_maxmemory == 201326592, manifest
              assert services['redis']['mem_limit'] == 512 * 1024 * 1024, manifest
              assert redis_maxmemory <= 192 * 1024 * 1024, manifest
              assert 'redis-data' in services['redis']['volumes'][0]['source'], manifest
              assert config['networks']['backend']['internal'] is True, manifest
              assert 'ports' not in services['redis'], manifest
              if source_build:
                  assert 'MCP_BUILD_SHA' in server['environment'], manifest
                  assert 'MCP_SOURCE_FINGERPRINT' in server['environment'], manifest
              else:
                  assert 'MCP_BUILD_SHA' not in server['environment'], manifest
                  assert 'MCP_SOURCE_FINGERPRINT' not in server['environment'], manifest
              if mode == 'portal':
                  assert 'ports' not in services['ffmpeg-mcp'], manifest
                  assert set(server['networks']) == {'backend', 'egress', 'portal'}, manifest
              else:
                  assert set(server['networks']) == {'backend', 'egress'}, manifest
                  assert server['ports'][0]['host_ip'] == '127.0.0.1', manifest
          PY
      - name: Build exact source
        id: source
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')
          echo "fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          docker build \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            --build-arg SOURCE_FINGERPRINT="$SOURCE_FINGERPRINT" \
            --build-arg IMAGE_VERSION=1.0.0 \
            --tag ffmpeg-mcp:ci \
            .
      - name: Smoke the supplied standalone and Portal stacks
        env:
          MCP_ACCESS_TOKEN: ci-standalone-token-000000000000000000000000000000000000000000
          MCP_PORTAL_GRANT_TOKEN: ci-portal-grant-000000000000000000000000000000000000000000
          MCP_PRINCIPAL_HASH_SECRET: ci-principal-secret-000000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: ci-download-secret-000000000000000000000000000000000000000000
          REDIS_PASSWORD: ci-redis-password-000000000000000000000000000000000000000000
          MCP_PORTAL_NETWORK: ffmpeg-mcp-ci-portal
          MCP_BUILD_SHA: ${{ github.sha }}
          MCP_SOURCE_FINGERPRINT: ${{ steps.source.outputs.fingerprint }}
          MCP_IMAGE_REFERENCE: development
          PUBLIC_BASE_URL: http://127.0.0.1:8087
        run: |
          set -Eeuo pipefail
          active_manifest=
          cleanup() {
            if [[ -n "$active_manifest" ]]; then
              docker compose -f "$active_manifest" down --volumes >/dev/null 2>&1 || true
            fi
            docker network rm "$MCP_PORTAL_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker tag ffmpeg-mcp:ci ffmpeg-mcp:local-source
          for active_manifest in docker-compose.yml docker-compose.portal.yml; do
            if [[ "$active_manifest" == docker-compose.portal.yml ]]; then
              docker network create "$MCP_PORTAL_NETWORK" >/dev/null
            fi
            docker compose -f "$active_manifest" up --detach --no-build
            test "$(docker compose -f "$active_manifest" exec --no-TTY redis id -u)" = 999
            test "$(docker compose -f "$active_manifest" exec --no-TTY redis id -g)" = 1000
            for service in redis ffmpeg-mcp worker; do
              container=$(docker compose -f "$active_manifest" ps --quiet "$service")
              ready=false
              for _ in {1..45}; do
                if [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")" == healthy ]]; then
                  ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$ready" != true ]]; then
                docker compose -f "$active_manifest" logs --no-color >&2
                exit 1
              fi
            done
            docker compose -f "$active_manifest" exec --no-TTY \
              -e "EXPECTED_BUILD_SHA=$GITHUB_SHA" \
              -e "EXPECTED_SOURCE_FINGERPRINT=${{ steps.source.outputs.fingerprint }}" \
              -e EXPECTED_IMAGE_REFERENCE=development \
              -e MCP_SMOKE_MEDIA_ROUNDTRIP=true \
              -e MCP_SMOKE_JOB_TIMEOUT_SECONDS=60 \
              ffmpeg-mcp python /app/scripts/runtime_smoke.py
            docker compose -f "$active_manifest" down --volumes
            if [[ "$active_manifest" == docker-compose.portal.yml ]]; then
              docker network rm "$MCP_PORTAL_NETWORK" >/dev/null
            fi
          done
          active_manifest=
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ffmpeg-mcp:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Smoke both modes and worker without external calls
        run: |
          bash .github/scripts/smoke-image.sh \
            ffmpeg-mcp:ci \
            "$GITHUB_SHA" \
            "${{ steps.source.outputs.fingerprint }}" \
            development
