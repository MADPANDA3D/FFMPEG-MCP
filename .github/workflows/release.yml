name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/madpanda3d/ffmpeg-mcp-server
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
  UV_VERSION: 0.11.29

jobs:
  verify-python:
    name: Python ${{ matrix.python }} exact-tag verification
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.13', '3.13.11']
    steps:
      - name: Check out exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify exact stable tag and package version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          RELEASE_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")
          test "$RELEASE_SHA" = "$TAG_SHA"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"
      - name: Test exact tag on Python ${{ matrix.python }}
        run: |
          uv sync --frozen --group dev
          uv run python -m compileall -q src scripts tests
          uv run pytest -q -p no:cacheprovider
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Run single-version source and dependency gates
        if: matrix.python == '3.12.13'
        run: |
          uv run python scripts/check_source_safety.py
          uv run bandit -q -r src/madpanda_ffmpeg_mcp -lll
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file requirements.lock
          git diff --exit-code -- requirements.lock
          uv run pip-audit --requirement requirements.lock

  compose:
    name: Exact-tag deployment contracts
    runs-on: ubuntu-24.04
    needs: verify-python
    steps:
      - name: Check out exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Validate source and immutable variants
        env:
          MCP_ACCESS_TOKEN: release-standalone-token-000000000000000000000000000000000000000000
          MCP_PORTAL_GRANT_TOKEN: release-portal-grant-000000000000000000000000000000000000000000
          MCP_PRINCIPAL_HASH_SECRET: release-principal-secret-0000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: release-download-secret-0000000000000000000000000000000000000000
          REDIS_PASSWORD: release-redis-password-00000000000000000000000000000000000000000
          MCP_PORTAL_NETWORK: release-portal-network
          PUBLIC_BASE_URL: https://ffmpeg-mcp.example.invalid
          MCP_BUILD_SHA: ${{ github.sha }}
          MCP_SOURCE_FINGERPRINT: 1111111111111111111111111111111111111111111111111111111111111111
          MCP_IMAGE_REFERENCE: development
          MCP_RELEASE_DIGEST: 2222222222222222222222222222222222222222222222222222222222222222
        run: |
          for manifest in \
            docker-compose.yml \
            docker-compose.portal.yml \
            docker-compose.release.yml \
            docker-compose.portal.release.yml; do
            docker compose -f "$manifest" config --quiet
          done

  publish:
    name: Verify and publish exact tag
    runs-on: ubuntu-24.04
    needs: [verify-python, compose]
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify exact stable tag and package version
        id: release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          RELEASE_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")
          test "$RELEASE_SHA" = "$TAG_SHA"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and inspect tagged Python artifacts
        env:
          MCP_MODE: standalone
          MCP_ACCESS_TOKEN: release-access-token-00000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: release-download-secret-0000000000000000000000000000000000000000
          PUBLIC_BASE_URL: http://127.0.0.1:8087
        run: |
          uv sync --frozen --group dev
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file requirements.lock
          git diff --exit-code -- requirements.lock
          uv run pip-audit --requirement requirements.lock
          uv build
          uv run twine check dist/*
          python -m venv /tmp/ffmpeg-wheel-venv
          /tmp/ffmpeg-wheel-venv/bin/python -m pip install \
            --disable-pip-version-check --require-hashes \
            --requirement requirements.lock
          /tmp/ffmpeg-wheel-venv/bin/python -m pip install \
            --disable-pip-version-check --no-deps dist/*.whl
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" /tmp/ffmpeg-wheel-venv/bin/python - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          from madpanda_ffmpeg_mcp import __version__
          from madpanda_ffmpeg_mcp.server import TOOL_REGISTRY, _current_tool_manifest

          release = os.environ['RELEASE_VERSION']
          assert version('mad-mcp-ffmpeg') == release
          assert __version__ == release
          assert len(TOOL_REGISTRY) == 55
          manifest = _current_tool_manifest()
          assert manifest['catalogVersion'] == '2026-07-18.4'
          assert manifest['counts']['agentReady'] == 55
          assert manifest['counts']['legacy'] == 0
          scripts = {item.name: item.value for item in entry_points(group='console_scripts')}
          assert scripts['mad-mcp-ffmpeg'] == 'madpanda_ffmpeg_mcp.server:main'
          assert scripts['mad-mcp-ffmpeg-worker'] == 'madpanda_ffmpeg_mcp.worker:main'
          PY
      - name: Scan exact tag history with Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --no-banner .
      - name: Validate workflow syntax and semantics
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Scan source configuration and secrets with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      - name: Record Python artifact checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Attest Python release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*
      - name: Compute exact-source fingerprint
        id: source
        run: echo "fingerprint=$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build release candidate
        run: |
          docker build \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            --build-arg SOURCE_FINGERPRINT="${{ steps.source.outputs.fingerprint }}" \
            --build-arg IMAGE_VERSION="${GITHUB_REF_NAME#v}" \
            --tag ffmpeg-mcp:release-candidate \
            .
      - name: Scan release candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ffmpeg-mcp:release-candidate
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Smoke release candidate in both modes
        run: |
          bash .github/scripts/smoke-image.sh \
            ffmpeg-mcp:release-candidate \
            "$GITHUB_SHA" \
            "${{ steps.source.outputs.fingerprint }}" \
            development
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
      - name: Publish image with SBOM and provenance
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            SOURCE_FINGERPRINT=${{ steps.source.outputs.fingerprint }}
            IMAGE_VERSION=${{ steps.release.outputs.version }}
          sbom: true
          provenance: mode=max
      - name: Scan exact published digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Attest published image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Require anonymous pull access
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >/dev/null; then
            echo "::error::The GHCR package is not public. Make the linked package public, then rerun this exact tagged workflow."
            exit 1
          fi
          docker pull "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
      - name: Validate immutable Compose at published digest
        env:
          MCP_ACCESS_TOKEN: release-standalone-token-000000000000000000000000000000000000000000
          MCP_PORTAL_GRANT_TOKEN: release-portal-grant-000000000000000000000000000000000000000000
          MCP_PRINCIPAL_HASH_SECRET: release-principal-secret-0000000000000000000000000000000000000000
          DOWNLOAD_SIGNING_SECRET: release-download-secret-0000000000000000000000000000000000000000
          REDIS_PASSWORD: release-redis-password-00000000000000000000000000000000000000000
          MCP_PORTAL_NETWORK: release-portal-network
          PUBLIC_BASE_URL: https://ffmpeg-mcp.example.invalid
        run: |
          PUBLISHED_DIGEST="${{ steps.push.outputs.digest }}"
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export MCP_RELEASE_DIGEST="${PUBLISHED_DIGEST#sha256:}"
          docker compose -f docker-compose.release.yml config --format json \
            > /tmp/docker-compose.release.json
          docker compose -f docker-compose.portal.release.yml config --format json \
            > /tmp/docker-compose.portal.release.json
          EXPECTED_IMAGE="${IMAGE_NAME}@${PUBLISHED_DIGEST}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          for manifest in ('docker-compose.release', 'docker-compose.portal.release'):
              config = json.loads(Path(f'/tmp/{manifest}.json').read_text())
              for name in ('ffmpeg-mcp', 'worker'):
                  service = config['services'][name]
                  assert 'build' not in service, (manifest, name)
                  assert service['image'] == os.environ['EXPECTED_IMAGE'], (manifest, name)
                  assert service['environment']['MCP_IMAGE_REFERENCE'] == os.environ['EXPECTED_IMAGE'], (manifest, name)
                  assert 'MCP_BUILD_SHA' not in service['environment'], (manifest, name)
                  assert 'MCP_SOURCE_FINGERPRINT' not in service['environment'], (manifest, name)
          PY
      - name: Smoke exact anonymously pulled digest
        run: |
          bash .github/scripts/smoke-image.sh \
            "${IMAGE_NAME}@${{ steps.push.outputs.digest }}" \
            "$GITHUB_SHA" \
            "${{ steps.source.outputs.fingerprint }}" \
            "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
      - name: Create GitHub Release with package artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release view "$GITHUB_REF_NAME" --json body --jq .body \
              > /tmp/ffmpeg-mcp-release-notes.md
            python - <<'PY'
          import os
          import re
          from pathlib import Path

          notes_path = Path('/tmp/ffmpeg-mcp-release-notes.md')
          notes = notes_path.read_text()
          digest_line = f"Container: `{os.environ['IMAGE_NAME']}@{os.environ['IMAGE_DIGEST']}`"
          pattern = r"(?m)^Container: `ghcr\.io/madpanda3d/ffmpeg-mcp-server@sha256:[0-9a-f]{64}`$"
          if re.search(pattern, notes):
              notes = re.sub(pattern, digest_line, notes)
          else:
              notes = f"{notes.rstrip()}\n\n{digest_line}\n"
          notes_path.write_text(notes)
          PY
            gh release edit "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "MADPANDA3D FFMPEG MCP $GITHUB_REF_NAME" \
              --notes-file /tmp/ffmpeg-mcp-release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "MADPANDA3D FFMPEG MCP $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Container: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" \
              --latest
          fi
