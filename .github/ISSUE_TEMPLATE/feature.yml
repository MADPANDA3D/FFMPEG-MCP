name: Feature request
description: Propose a bounded tool or deployment improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What concrete workflow is blocked today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, limits, failure behavior, and security impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
    validations:
      required: false
