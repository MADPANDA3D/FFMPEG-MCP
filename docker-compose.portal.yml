name: ffmpeg-mcp

x-image: &source-image
  build:
    context: .
    args:
      BUILD_SHA: ${MCP_BUILD_SHA:-development}
      SOURCE_FINGERPRINT: ${MCP_SOURCE_FINGERPRINT:-development}
      IMAGE_VERSION: ${MCP_IMAGE_VERSION:-1.0.0}
  image: ffmpeg-mcp:local-source

x-runtime: &runtime
  <<: *source-image
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
  volumes:
    - ffmpeg-data:/data
  depends_on:
    redis:
      condition: service_healthy

