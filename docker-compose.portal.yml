services:
  ffmpeg-mcp:
    <<: *runtime
    environment: *server-environment
    mem_limit: 768m
    cpus: 1.0
    expose: ["8087"]
    networks: [backend, egress, portal]

  worker:
    <<: *runtime
    command: [mad-mcp-ffmpeg-worker]
    environment: *processing-environment
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: [CMD, python, -c, "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [backend, egress]

  redis:
    image: redis:7.4.5-alpine@sha256:0302cccee2b2043e61b497c8f4075467c5f7ba27a9f38be7e092634f2734baed
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a URL-safe REDIS_PASSWORD}
      REDIS_MAXMEMORY_BYTES: ${REDIS_MAXMEMORY_BYTES:-201326592}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory "$$REDIS_MAXMEMORY_BYTES" --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks: [backend]

networks:
  backend:
    internal: true
  egress:
    driver: bridge
  portal:
    external: true
    name: ${MCP_PORTAL_NETWORK:?Set MCP_PORTAL_NETWORK to the private broker network name}

volumes:
  ffmpeg-data:
  redis-data:
