name: ffmpeg-mcp

services:
  ffmpeg-mcp:
    container_name: ffmpeg-mcp
    image: ffmpeg-mcp-ffmpeg-mcp:${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
        BUILD_VERSION: ${BUILD_VERSION:-2026-07-12.3}
    restart: unless-stopped
    init: true
    user: "${MCP_RUNTIME_UID:-1002}:${MCP_RUNTIME_GID:-1003}"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      MCP_HTTP_PORT: "8087"
      REDIS_URL: "redis://ffmpeg-mcp-redis:6379/0"
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data
    depends_on:
      ffmpeg-mcp-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8087/health', timeout=3)); assert data.get('status') == 'healthy' and data.get('configuration_ready') is True and int(data.get('tool_count', 0)) > 0",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2g
          pids: 512
    networks:
      - mcp-network

  ffmpeg-mcp-worker:
    container_name: ffmpeg-mcp-worker
    image: ffmpeg-mcp-ffmpeg-mcp-worker:${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
        BUILD_VERSION: ${BUILD_VERSION:-2026-07-12.3}
    restart: unless-stopped
    init: true
    user: "${MCP_RUNTIME_UID:-1002}:${MCP_RUNTIME_GID:-1003}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://ffmpeg-mcp-redis:6379/0"
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA must be the deployed commit SHA}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "worker.py"]
    volumes:
      - ./data:/data
    depends_on:
      ffmpeg-mcp-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.getenv('REDIS_URL', 'redis://ffmpeg-mcp-redis:6379/0')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 4g
          pids: 1024
    networks:
      - mcp-network

  ffmpeg-mcp-redis:
    container_name: ffmpeg-mcp-redis
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:size=128m,mode=0770,uid=999,gid=1000
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
          pids: 128
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
    name: mcp-network
